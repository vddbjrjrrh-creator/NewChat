name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать Android-проект
        run: |
          set -e
          APP_URL="https://vddbjrjrrh-creator.github.io/NewChat/"
          mkdir -p android/app/src/main/java/com/newchat/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/xml

          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Newchat"
          include ':app'
          EOF

          cat > android/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > android/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.newchat.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.newchat.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/newchat/app/MainActivity.java << EOF
          package com.newchat.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import android.net.Uri;
          import android.content.Intent;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.webkit.JavascriptInterface;

          public class MainActivity extends Activity {

              private static final String APP_URL = "${APP_URL}";
              private WebView web;
              private PermissionRequest pendingWebPerm;             // запрос микрофона/камеры от сайта
              private ValueCallback<Uri[]> pendingFile;             // выбор файла (скрепка, аватар, сторис)
              private static final int RC_PERM = 71;
              private static final int RC_FILE = 72;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#EEF0F5"));

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setSupportMultipleWindows(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  // Мост для громкой связи: сайт может переключать динамик/ухо
                  web.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setSpeaker(final boolean on) {
                          runOnUiThread(() -> {
                              try {
                                  AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                                  am.setMode(AudioManager.MODE_IN_COMMUNICATION);
                                  am.setSpeakerphoneOn(on);
                              } catch (Exception ignored) {}
                          });
                      }
                      @JavascriptInterface
                      public void endCallAudio() {
                          runOnUiThread(() -> {
                              try {
                                  AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                                  am.setMode(AudioManager.MODE_NORMAL);
                                  am.setSpeakerphoneOn(true);
                              } catch (Exception ignored) {}
                          });
                      }
                  }, "NewchatBridge");

                  web.setWebChromeClient(new WebChromeClient() {

                      // Сайт просит микрофон или камеру — пробрасываем в Android
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          java.util.ArrayList<String> need = new java.util.ArrayList<>();
                          for (String r : request.getResources()) {
                              if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)
                                      && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  need.add(Manifest.permission.RECORD_AUDIO);
                              }
                              if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)
                                      && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                  need.add(Manifest.permission.CAMERA);
                              }
                          }
                          if (need.isEmpty()) {
                              request.grant(request.getResources());
                          } else {
                              pendingWebPerm = request;
                              requestPermissions(need.toArray(new String[0]), RC_PERM);
                          }
                      }

                      // Скрепка, аватар, сторисы: открыть галерею
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (pendingFile != null) pendingFile.onReceiveValue(null);
                          pendingFile = callback;
                          try {
                              startActivityForResult(params.createIntent(), RC_FILE);
                          } catch (Exception e) {
                              pendingFile = null;
                              Toast.makeText(MainActivity.this, "Не удалось открыть галерею", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean dialog,
                                                    boolean gesture, android.os.Message result) {
                          // Приложение попросило открыть ссылку в новом окне (window.open)
                          WebView tmp = new WebView(MainActivity.this);
                          tmp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, String url) {
                                  openOutside(url);
                                  return true;
                              }
                          });
                          ((android.webkit.WebView.WebViewTransport) result.obj).setWebView(tmp);
                          result.sendToTarget();
                          return true;
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          // Telegram и прочие внешние ссылки открываем в их приложениях
                          if (isExternal(url)) {
                              openOutside(url);
                              return true;
                          }
                          view.loadUrl(url);
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, int code, String desc, String url) {
                          Toast.makeText(MainActivity.this,
                              "Нет связи. Проверьте интернет.", Toast.LENGTH_SHORT).show();
                      }
                  });

                  setContentView(web);

                  if (state != null) {
                      web.restoreState(state);
                  } else {
                      web.loadUrl(APP_URL);
                  }

                  /* Сразу просим главные разрешения — как делают все мессенджеры */
                  java.util.ArrayList<String> ask = new java.util.ArrayList<>();
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      ask.add(Manifest.permission.RECORD_AUDIO);
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      ask.add(Manifest.permission.POST_NOTIFICATIONS);
                  if (!ask.isEmpty()) requestPermissions(ask.toArray(new String[0]), 70);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              // Ссылка ведёт наружу: Telegram, почта, звонок и т.п.
              private boolean isExternal(String url) {
                  if (url == null) return false;
                  if (!url.startsWith("http")) return true;
                  return url.contains("t.me/")
                      || url.contains("telegram.me/")
                      || url.contains("telegram.org/");
              }

              // Отдаём ссылку системе — откроется Telegram или браузер
              private void openOutside(String url) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть ссылку", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (code == RC_PERM && pendingWebPerm != null) {
                      boolean ok = true;
                      for (int r : res) if (r != PackageManager.PERMISSION_GRANTED) ok = false;
                      if (ok) pendingWebPerm.grant(pendingWebPerm.getResources());
                      else pendingWebPerm.deny();
                      pendingWebPerm = null;
                  }
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  super.onActivityResult(code, result, data);
                  if (code == RC_FILE && pendingFile != null) {
                      pendingFile.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(result, data));
                      pendingFile = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Newchat</string>
          </resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#EEF0F5</item>
                  <item name="android:navigationBarColor">#EEF0F5</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#6C5CE7</color>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,30 L72,38 L72,54 C72,68 63,76 54,80 C45,76 36,68 36,54 L36,38 Z" />
          </vector>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          echo "Проект собран, файлы на месте:"
          find android -type f | sort

      - name: Собрать APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/newchat.apk
          ls -la out

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: newchat-apk
          path: out/newchat.apk

      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Newchat APK ${{ github.run_number }}
          body: |
            Установочный файл Newchat.

            Как поставить:
            1. Скачай newchat.apk на телефон
            2. Открой его — Android спросит разрешение на установку из этого источника, разреши
            3. Установи и открывай
          files: out/newchat.apk
